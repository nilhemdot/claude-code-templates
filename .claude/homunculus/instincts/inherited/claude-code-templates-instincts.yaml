# Claude Code Templates Workflow Multi Package Dependency Upgrade

## Action

Follow the multi-package-dependency-upgrade workflow:
1. Identify outdated dependencies in each package (package.json).
2. Update package.json and package-lock.json files in each affected directory.
3. Commit all updated files together, often with a detailed changelog in the commit message.

## Evidence

- Workflow detected from commit patterns
- Frequency: ~2x per month
- Files: */package.json, */package-lock.json, package.json

